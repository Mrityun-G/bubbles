name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. A quick check of the
        [open issues](https://github.com/ViezeVingertjes/bubbles/issues) saves
        duplicates, but filing a duplicate is not a problem - we would rather
        hear about it twice than not at all.

        If you are not sure whether something is a bug or intended behaviour,
        file it anyway and say so.

  - type: textarea
    id: repro
    attributes:
      label: Minimal `.bub` reproduction
      description: >
        The shortest `.bub` script (or Rust snippet) that triggers the bug.
        Inline it here rather than attaching a file so it is searchable.
      placeholder: |
        title: Repro
        ---
        ...
        ===
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead? Paste any error output here.
    validations:
      required: true

  - type: input
    id: rustc
    attributes:
      label: Rust version
      description: Output of `rustc --version`
      placeholder: "rustc 1.xx.x (xxxxxxxxx xxxx-xx-xx)"
    validations:
      required: true

  - type: input
    id: crate-version
    attributes:
      label: bubbles-dialogue version
      placeholder: "2.0.0"
    validations:
      required: true
